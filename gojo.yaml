version: 1
project:
  name: codepulse
  defaultBranch: main
repository:
  remote: origin
  syncBeforeRun: true
  requireCleanBase: true
  submodules: false
  gitLfs: false
instructions:
  files:
    - .gojo/instructions.md
  scheduledRunNotice: |
    Unattended scheduled gojo run. Prefer small diffs. Write .gojo/handoff.json before exiting.
profiles:
  shell:
    adapter: shell
    timeout: 5m
  cursor:
    adapter: cursor
    model: default
    timeout: 45m
validationProfiles:
  repo-brief:
    steps:
      - name: file-exists
        command: test -f docs/REPO_BRIEF.md
        timeout: 30s
      - name: has-stack
        command: grep -q '^## Stack' docs/REPO_BRIEF.md
        timeout: 30s
      - name: has-layout
        command: grep -q '^## Layout' docs/REPO_BRIEF.md
        timeout: 30s
      - name: enough-content
        command: wc -l docs/REPO_BRIEF.md | awk '$1 >= 20'
        timeout: 30s
  deps-rust:
    steps:
      - name: verify-rust
        command: bash scripts/verify-rust.sh
        timeout: 20m
      - name: handoff-exists
        command: test -f .gojo/handoff.json
        timeout: 30s
  deps-python:
    steps:
      - name: verify-python
        command: VENV_DIR=.codepulse/gojo-venv bash scripts/verify-python.sh
        timeout: 15m
      - name: handoff-exists
        command: test -f .gojo/handoff.json
        timeout: 30s
  deps-dotnet:
    steps:
      - name: verify-dotnet
        command: bash scripts/verify-dotnet.sh
        timeout: 15m
      - name: handoff-exists
        command: test -f .gojo/handoff.json
        timeout: 30s
  deps-mcp:
    steps:
      - name: verify-mcp
        command: bash scripts/verify-mcp.sh
        timeout: 10m
      - name: handoff-exists
        command: test -f .gojo/handoff.json
        timeout: 30s
  deps-babysit:
    steps:
      - name: noop
        command: "true"
        timeout: 30s
  self-heal:
    steps:
      - name: handoff-exists
        command: test -f .gojo/handoff.json
        timeout: 30s
  handoff:
    steps:
      - name: handoff-exists
        command: test -f .gojo/handoff.json
        timeout: 30s
agents:
  repo-brief:
    description: Inventory the repo and write docs/REPO_BRIEF.md
    promptFile: .gojo/agents/repo-brief.sh
    validationProfile: repo-brief
    integration:
      mode: commit-only
      targetBranch: main
      requireAllValidations: true
      commitMessage: "gojo: add repository brief"
    profile: shell
  deps-rust:
    description: Update Rust workspace dependencies and open a PR
    promptFile: .gojo/agents/deps-rust.md
    validationProfile: deps-rust
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    integration:
      mode: pull-request
      targetBranch: main
      approval: reviewer
      fixRounds: 2
      requireAllValidations: true
    failurePolicy:
      maxAttemptsPerRun: 2
      disableAfterConsecutiveFailedRuns: 3
      backoff: exponential
    selfHeal:
      afterConsecutiveFailedRuns: 1
      agent: self-heal
    profile: cursor
  deps-python:
    description: Update Python agent dependencies and open a PR
    promptFile: .gojo/agents/deps-python.md
    validationProfile: deps-python
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    integration:
      mode: pull-request
      targetBranch: main
      approval: reviewer
      fixRounds: 2
      requireAllValidations: true
    failurePolicy:
      maxAttemptsPerRun: 2
      disableAfterConsecutiveFailedRuns: 3
      backoff: exponential
    selfHeal:
      afterConsecutiveFailedRuns: 1
      agent: self-heal
    profile: cursor
  deps-dotnet:
    description: Update .NET agent dependencies and open a PR
    promptFile: .gojo/agents/deps-dotnet.md
    validationProfile: deps-dotnet
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    integration:
      mode: pull-request
      targetBranch: main
      approval: reviewer
      fixRounds: 2
      requireAllValidations: true
    failurePolicy:
      maxAttemptsPerRun: 2
      disableAfterConsecutiveFailedRuns: 3
      backoff: exponential
    selfHeal:
      afterConsecutiveFailedRuns: 1
      agent: self-heal
    profile: cursor
  deps-pr-babysit:
    description: Independently review dependency PRs after source checks settle
    promptFile: .gojo/agents/deps-pr-babysit.md
    validationProfile: handoff
    trigger:
      on: pull-request-checks-settled
      fromAgents:
        - deps-rust
        - deps-python
        - deps-dotnet
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    failurePolicy:
      maxAttemptsPerRun: 1
      disableAfterConsecutiveFailedRuns: 5
      backoff: exponential
    profile: cursor
  self-heal:
    description: Diagnose failed gojo runs and report durable fixes in handoff
    promptFile: .gojo/agents/self-heal.md
    validationProfile: self-heal
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    failurePolicy:
      maxAttemptsPerRun: 1
      disableAfterConsecutiveFailedRuns: 5
      backoff: none
    profile: cursor
  activity-digest:
    description: Daily executive brief on what shipped in the last 24h and why it matters
    promptFile: .gojo/agents/activity-digest.md
    validationProfile: handoff
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    failurePolicy:
      maxAttemptsPerRun: 1
      disableAfterConsecutiveFailedRuns: 5
      backoff: exponential
    notifications:
      onSuccess:
        - ghost
      onFailure:
        - ghost
    profile: cursor
schedules:
  deps-rust:
    cron: 0 3 * * 5
    timezone: America/Detroit
    agent: deps-rust
  deps-python:
    cron: 0 3 * * 6
    timezone: America/Detroit
    agent: deps-python
  deps-dotnet:
    cron: 0 3 * * 0
    timezone: America/Detroit
    agent: deps-dotnet
  self-heal:
    cron: 30 6 * * *
    timezone: America/Detroit
    agent: self-heal
  activity-digest:
    cron: 0 8 * * *
    timezone: America/Detroit
    agent: activity-digest
notifications: {}
